services:
  - type: web
    name: smart-study-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: DATA_DIR
        value: /data
      - key: UPLOADS_DIR
        value: /data/uploads
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
